name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Vet & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        # 测试钩子（SetPoolForTest/ResetForTest）在 //go:build test 标签文件里，
        # 测试构建需 -tags test；生产 go build 天然排除。
        run: go vet -tags test ./...

      - name: Test
        run: go test -tags test ./...

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            goos: windows
            goarch: amd64
            artifact: pg-mcp.exe
          - target: linux
            goos: linux
            goarch: amd64
            artifact: pg-mcp-linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          go build -trimpath -ldflags "-s -w" -o ${{ matrix.artifact }} .
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: pg-mcp-${{ matrix.target }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    # 仅 tag 触发时发布到 Releases；workflow_dispatch 只产出构建产物（Artifacts）
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show artifacts
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
