name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Vet & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        # 测试钩子（SetPoolForTest/ResetForTest）在 //go:build test 标签文件里，
        # 测试构建需 -tags test；生产 go build 天然排除。
        run: go vet -tags test ./...

      - name: Test
        run: go test -tags test ./...

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            goos: windows
            goarch: amd64
            artifact: pg-mcp.exe
          - target: linux
            goos: linux
            goarch: amd64
            artifact: pg-mcp-linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          go build -trimpath -ldflags "-s -w" -o ${{ matrix.artifact }} .
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: pg-mcp-${{ matrix.target }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # GitHub Releases 必须基于 tag：
      # - v* tag 推送 → 版本化 tag（如 v2.2.0），npm postinstall 也从此下载
      # - main 推送 → 用 commit SHA 生成唯一 tag（幂等，不会产生重复 Release）
      - name: Compute release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=release-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show artifacts
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          files: dist/*
          generate_release_notes: true

  npm-publish:
    name: Publish npm (postgresqlmcp-server)
    needs: build
    runs-on: ubuntu-latest
    # 仅 v* tag 推送时发布 npm，版本号与 tag 对齐（如 v2.2.0 → 2.2.0）
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Set package version from tag
        working-directory: npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm pkg set version="$VERSION"

      - name: Publish to npm
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
